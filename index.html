<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Thought Ledger">
<title>Thought Ledger</title>
<style>
  :root{
    --ink:#1A1A18;
    --ink2:#4C4A45;
    --ink3:#8C8A83;
    --paper:#FFFFFF;
    --bar:#F1F0EC;
    --rule:#D8D6CF;
    --rule2:#E8E6E0;
    --red:#9E3527;
    --field:#FFFFFF;
    --on-chip:#FFFFFF;
    --lift:rgba(26,26,24,.16);
    color-scheme: light dark;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --ink:#E9E8E4;
      --ink2:#AFADA7;
      --ink3:#807E78;
      --paper:#161615;
      --bar:#201F1D;
      --rule:#3B3A36;
      --rule2:#2A2926;
      --red:#E08375;
      --field:#1E1E1C;
      --on-chip:#161615;
      --lift:rgba(0,0,0,.55);
    }
  }

  .lg *{box-sizing:border-box;}
  .lg{
    font-family:var(--sans); color:var(--ink); background:var(--paper);
    border:1px solid var(--rule); max-width:760px; margin:0 auto;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }

  .lg-top{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; flex-wrap:wrap; padding:18px 18px 14px;
    border-bottom:2px solid var(--ink);
  }
  .lg-top h1{
    font-size:21px; font-weight:700; margin:0; letter-spacing:-.01em;
    display:flex; align-items:center; gap:9px;
  }
  .mark{width:28px; height:30px; flex:0 0 auto; color:var(--ink); overflow:visible;}
  .mark .fig{transform-box:view-box; transform-origin:22px 36px; animation:breathe 2.8s ease-in-out 3;}
  @keyframes breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.035);}
  }

  .cap{display:flex; align-items:stretch; border-bottom:2px solid var(--ink); background:var(--field);}
  .cap input{
    flex:1; min-width:0; border:0; outline:0; background:transparent;
    font-family:var(--sans); font-size:16.5px; color:var(--ink); padding:20px 18px;
  }
  .cap input::placeholder{color:var(--ink3);}
  .cap input:focus-visible{box-shadow:inset 3px 0 0 var(--ink);}
  .cap button{
    border:0; border-left:1px solid var(--rule2); background:transparent; cursor:pointer;
    font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:.06em;
    color:var(--ink2); padding:0 20px; white-space:nowrap;
  }
  .cap button:hover{background:var(--bar); color:var(--ink);}

  .head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding:24px 18px 10px;}
  .head h2{font-size:16.5px; font-weight:700; margin:0; letter-spacing:.02em;}
  .head .tally{
    margin-left:auto; font-family:var(--mono); font-size:11px;
    color:var(--ink3); font-variant-numeric:tabular-nums;
  }

  .rows{border-top:2px solid var(--ink);}
  .row{display:flex; align-items:flex-start; gap:10px; padding:9px 18px; border-bottom:1px solid var(--rule2);}
  .rows .row:nth-child(odd){background:var(--bar);}
  .row .n{
    font-family:var(--mono); font-size:11px; color:var(--ink3);
    font-variant-numeric:tabular-nums; padding-top:3px; flex:0 0 auto;
  }
  .row .tx{flex:1; min-width:0; font-size:14.5px; word-break:break-word; outline:0; padding-top:1px;}
  .row .tx:focus{box-shadow:0 1px 0 var(--ink);}
  .row .act{display:flex; gap:4px; flex-wrap:wrap; flex:0 0 auto; align-items:center;}

  .chip{
    border:1px solid currentColor; color:var(--c); background:transparent; cursor:pointer;
    font-family:var(--sans); font-size:10.5px; line-height:1;
    padding:4px 7px; white-space:nowrap; opacity:.5;
  }
  .row:hover .chip, .row:focus-within .chip{opacity:1;}
  .chip:hover{background:var(--c); color:var(--on-chip);}

  .icon{
    border:0; background:transparent; cursor:pointer; color:var(--ink3);
    font-family:var(--mono); font-size:13px; line-height:1; padding:4px 5px;
    opacity:0; transition:opacity .12s;
  }
  .row:hover .icon, .row:focus-within .icon{opacity:1;}
  .icon:hover{color:var(--red);}
  .icon.back:hover{color:var(--ink);}

  .chk{
    flex:0 0 auto; width:18px; height:18px; margin-top:2px;
    border:1.5px solid var(--ink3); background:var(--field); cursor:pointer;
    font-family:var(--mono); font-size:12px; line-height:15px; color:var(--ink);
    padding:0; text-align:center; border-radius:2px;
  }
  .chk:hover{border-color:var(--ink); background:var(--bar);}
  .row.done .chk{border-color:var(--rule); color:var(--ink3);}
  .row.done .tx{color:var(--ink3); text-decoration:line-through;}

  /* ---------- tabs ---------- */
  .tabs{display:flex; flex-wrap:wrap; align-items:center; padding:0 18px;}
  .tab{
    border:0; border-bottom:2px solid transparent; background:transparent; cursor:pointer;
    font-family:var(--sans); font-size:12.5px; color:var(--ink3);
    padding:7px 12px 6px 0; margin-right:14px; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tab .c{font-family:var(--mono); font-size:10.5px; margin-left:5px; font-variant-numeric:tabular-nums;}
  .tab:hover{color:var(--ink2);}
  .tab[aria-selected="true"]{color:var(--c); border-bottom-color:var(--c); font-weight:600;}
  .tab-edit{
    border:0; background:transparent; cursor:pointer; margin-left:auto; padding:7px 0;
    font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--ink3);
    text-decoration:underline; text-underline-offset:3px; white-space:nowrap;
  }
  .tab-edit:hover{color:var(--ink);}

  /* ---------- category editor ---------- */
  .ed{margin:6px 18px 12px; border:1px solid var(--rule); background:var(--field);}
  .ed-row{display:flex; align-items:center; gap:9px; padding:7px 10px; border-bottom:1px solid var(--rule2);}
  .sw{
    width:11px; height:11px; flex:0 0 auto; border-radius:2px; border:0;
    cursor:pointer; padding:0;
  }
  .sw:hover{outline:2px solid var(--rule); outline-offset:1px;}
  .ed-in{
    flex:1; min-width:0; border:0; outline:0; background:transparent;
    font-family:var(--sans); font-size:13.5px; color:var(--ink); padding:2px 0;
  }
  .ed-in:focus{box-shadow:0 1px 0 var(--ink);}
  .ed-del{
    border:0; background:transparent; cursor:pointer; flex:0 0 auto;
    font-family:var(--mono); font-size:10.5px; color:var(--ink3); padding:3px 4px;
  }
  .ed-del:hover{color:var(--red);}
  .ed-del.confirm{color:var(--red); font-weight:700;}
  .ed-del:disabled{opacity:.28; cursor:not-allowed;}
  .ed-foot{display:flex; gap:16px; align-items:center; padding:9px 10px 4px;}
  .ed-foot button{
    border:0; background:transparent; cursor:pointer; padding:0;
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--ink2);
    text-decoration:underline; text-underline-offset:3px;
  }
  .ed-foot button:hover{color:var(--ink);}
  #doneAccts{margin-left:auto;}
  .ed-note{margin:0; padding:2px 10px 9px; font-size:11px; color:var(--ink3); line-height:1.45;}

  .grip{
    flex:0 0 auto; border:0; background:transparent; cursor:grab; padding:4px 6px;
    color:var(--ink3); font-family:var(--mono); font-size:13px; line-height:1;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .grip:hover{color:var(--ink2);}
  .grip:active{cursor:grabbing;}
  .row.dragging{
    background:var(--field) !important; position:relative; z-index:3;
    box-shadow:0 3px 14px var(--lift); opacity:.96;
  }
  .rows.dragging-on .row{transition:none;}

  /* touch devices have no hover — keep icons visible */
  @media (hover: none){
    .icon{opacity:1;}
    .chip{opacity:1;}
  }

  .empty{padding:22px 18px; border-bottom:1px solid var(--rule2);}
  .foot{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 18px 12px;
    font-family:var(--mono); font-size:10.5px; color:var(--ink3); letter-spacing:.06em;
  }
  .foot button{
    border:0; background:transparent; cursor:pointer; padding:0;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink3);
    text-decoration:underline; text-underline-offset:3px;
  }
  .foot button:hover{color:var(--ink);}
  .foot .st{margin-left:auto;}

  :focus-visible{outline:2px solid var(--ink); outline-offset:1px;}

  @media (max-width:520px){
    .lg{border-left:0; border-right:0;}
    .row{flex-wrap:wrap;}
    .row .act{width:100%; padding-left:28px;}
    .cap input{font-size:16px; padding:14px;}
    .tab-edit{margin-left:0;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important;}
    .mark .fig{transform:none;}
  }
</style>

<div class="lg">
  <div class="lg-top">
    <h1><svg class="mark" viewBox="3 0 38 40" aria-hidden="true">
      <g class="fig">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="22" cy="8.6" r="6.2"/>
          <path d="M22 14.8v4.2"/>
          <path d="M13 20.6Q22 17.4 31 20.6"/>
          <path d="M13 20.6C9.6 24 13 26.4 22 27.8"/>
          <path d="M31 20.6C34.4 24 31 26.4 22 27.8"/>
          <path d="M6.6 32.6C12 27.4 32 27.4 37.4 32.6C32 37.8 12 37.8 6.6 32.6Z"/>
          <path d="M18.9 32.4q3.1 2.6 6.2 0"/>
        </g>
        <circle cx="19.6" cy="7.3" r="0.95" fill="currentColor"/>
        <circle cx="24.4" cy="7.3" r="0.95" fill="currentColor"/>
        <path d="M19.5 10.5q2.5 2.1 5 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </svg>Thought Ledger</h1>
  </div>

  <div class="cap">
    <input id="cap" type="text" autocomplete="off"
           placeholder="Write down whatever comes to mind, press enter" aria-label="Add a thought">
    <button id="add">Add</button>
  </div>

  <section>
    <div class="head">
      <h2>Unsorted</h2>
      <span class="tally" id="jtally">—</span>
    </div>
    <div class="rows" id="jlist"></div>
  </section>

  <section>
    <div class="head">
      <h2>Sorted</h2>
      <span class="tally" id="ltally">—</span>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="acctEditor"></div>
    <div class="rows" id="llist"></div>
  </section>

  <div class="foot">
    <button id="toggleDone">Show done</button>
    <button id="copy">Copy all</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <span class="st" id="status">Loading…</span>
  </div>
</div>

<script>
(function(){
  const KEY = 'thought-ledger-v1';
  const PALETTE = ['#1E4E5C','#7B5A17','#574A78','#4B5A53','#8A3B2E','#2F6B47','#3B4F7A','#6B4A2E'];
  const DEFAULTS = [
    {id:'d1', label:'Work',    color:PALETTE[0]},
    {id:'d2', label:'Study',   color:PALETTE[1]},
    {id:'d3', label:'Life',    color:PALETTE[2]},
    {id:'d4', label:'Someday', color:PALETTE[3]}
  ];

  let state = {seq:0, items:[], accts:null};
  let tab = null;
  let showDone = false;
  let editing = false;
  let saveTimer = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad = n => String(n).padStart(3,'0');
  const DARKC = {
    '#1E4E5C':'#6FB2C4', '#7B5A17':'#D2A74C', '#574A78':'#A99DD3', '#4B5A53':'#9BB1A7',
    '#8A3B2E':'#E08A79', '#2F6B47':'#76C497', '#3B4F7A':'#8EA7DA', '#6B4A2E':'#C99D74'
  };
  const darkOn = () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const col = a => darkOn() ? (DARKC[a.color] || a.color) : a.color;

  const acct = id => state.accts.find(a=>a.id===id);
  const setStatus = t => { $('status').textContent = t; };

  // ---------- storage: Claude account → browser local → memory ----------
  const mem = {};
  let mode = 'memory';
  const store = {
    async get(k){
      if(window.storage){
        try{ const r = await window.storage.get(k); mode='cloud'; return (r && r.value) || null; }
        catch(e){ mode='cloud'; return null; }
      }
      try{ mode='local'; return window.localStorage.getItem(k); }
      catch(e){ return mem[k] || null; }
    },
    async set(k,v){
      if(window.storage){ const ok = await window.storage.set(k,v); mode='cloud'; return !!ok; }
      try{ window.localStorage.setItem(k,v); mode='local'; return true; }
      catch(e){ mem[k]=v; mode='memory'; return false; }
    }
  };

  async function load(){
    try{
      const raw = await store.get(KEY);
      if(raw) state = JSON.parse(raw);
    }catch(e){}
    if(!state || typeof state !== 'object') state = {seq:0, items:[]};
    if(!Array.isArray(state.items)) state.items = [];
    if(!Array.isArray(state.accts) || !state.accts.length) state.accts = DEFAULTS.slice();
    if(typeof state.seq !== 'number') state.seq = state.items.length;
    tab = state.accts[0].id;
    render();
    setStatus(mode==='local' ? 'Saved locally' : (mode==='memory' ? "Can't save" : 'Saved'));
  }

  function save(){
    clearTimeout(saveTimer);
    setStatus('Saving…');
    saveTimer = setTimeout(async ()=>{
      try{
        const ok = await store.set(KEY, JSON.stringify(state));
        setStatus(!ok ? 'Not saved' : (mode==='local' ? 'Saved locally' : 'Saved'));
      }catch(e){ setStatus('Not saved'); }
    }, 250);
  }

  function nextN(){
    return state.items.reduce((m,i)=> Math.max(m, i.n||0), 0) + 1;
  }

  function add(text){
    text = (text||'').trim();
    if(!text) return;
    const n = nextN();
    state.seq = n;
    state.items.unshift({
      id:'e'+Date.now()+Math.random().toString(36).slice(2,6),
      n, text, acct:null, done:false, ts:Date.now()
    });
    save(); render();
  }

  const find = id => state.items.find(i=>i.id===id);
  const ordOf = i => (typeof i.ord === 'number' ? i.ord : 0);

  function chipsHTML(){
    return state.accts.map(a =>
      `<button class="chip" style="--c:${col(a)}" data-post="${a.id}" title="Move to ${esc(a.label)}">${esc(a.label)}</button>`
    ).join('');
  }

  function renderJournal(){
    const all  = state.items.filter(i=>i.acct===null);
    const open = all.filter(i=>!i.done);
    $('jtally').textContent = open.length ? open.length + (open.length===1?' item':' items') : '';

    let list = showDone ? all.slice() : open;
    list.sort((a,b)=> (a.done-b.done) || (b.ts-a.ts));

    if(!list.length){
      $('jlist').innerHTML = '<div class="empty"></div>';
      return;
    }
    $('jlist').innerHTML = list.map(i => `
      <div class="row ${i.done?'done':''}" data-id="${i.id}">
        <button class="chk" data-check aria-label="Mark done">${i.done?'✓':''}</button>
        <span class="n">${pad(i.n)}</span>
        <span class="tx" contenteditable="true" data-edit>${esc(i.text)}</span>
        <span class="act">${chipsHTML()}<button class="icon" data-del title="Delete">×</button></span>
      </div>`).join('');
  }

  function renderTabs(posted){
    if(!acct(tab)) tab = state.accts[0].id;
    $('tabs').innerHTML = state.accts.map(a=>{
      const n = posted.filter(i=>i.acct===a.id && !i.done).length;
      return `<button class="tab" role="tab" style="--c:${col(a)}" data-tab="${a.id}"
        aria-selected="${tab===a.id}">${esc(a.label)}<span class="c">${n}</span></button>`;
    }).join('') + `<button class="tab-edit" id="editAccts">${editing?'Close':'Edit categories'}</button>`;
  }

  function renderEditor(){
    if(!editing){ $('acctEditor').innerHTML = ''; return; }
    const only = state.accts.length === 1;
    $('acctEditor').innerHTML = `
      <div class="ed">
        ${state.accts.map(a=>`
          <div class="ed-row">
            <button class="sw" style="background:${col(a)}" data-cycle="${a.id}" title="Change colour"></button>
            <input class="ed-in" value="${esc(a.label)}" data-rename="${a.id}" aria-label="Category name">
            <button class="ed-del" data-delacct="${a.id}" ${only?'disabled title="Keep at least one category"':''}>Delete</button>
          </div>`).join('')}
        <div class="ed-foot">
          <button id="addAcct">+ Add category</button>
          <button id="doneAccts">Done</button>
        </div>
        <p class="ed-note">Rename in the field, tap the swatch to change colour. Deleting a category moves its items back to Unsorted — nothing is lost.</p>
      </div>`;
  }

  function renderLedger(){
    const posted = state.items.filter(i=>i.acct!==null);
    const open = posted.filter(i=>!i.done).length;
    $('ltally').textContent = posted.length ? open + ' open / ' + posted.length + ' total' : '';

    renderTabs(posted);
    renderEditor();

    let list = posted.filter(i=>i.acct===tab);
    if(!showDone) list = list.filter(i=>!i.done);
    list.sort((a,b)=> (a.done-b.done) || (ordOf(a)-ordOf(b)) || (b.ts-a.ts));

    if(!list.length){
      $('llist').innerHTML = '<div class="empty"></div>';
      return;
    }
    $('llist').innerHTML = list.map(i => `
      <div class="row ${i.done?'done':''}" data-id="${i.id}">
        <button class="chk" data-check aria-label="Mark done">${i.done?'✓':''}</button>
        <span class="tx" contenteditable="true" data-edit>${esc(i.text)}</span>
        <span class="act">
          <span class="n">${pad(i.n)}</span>
          <button class="icon back" data-unpost title="Move back to Unsorted">↩</button>
          <button class="icon" data-del title="Delete">×</button>
          <button class="grip" data-handle aria-label="Drag to reorder">≡</button>
        </span>
      </div>`).join('');
  }

  function render(){ renderJournal(); renderLedger(); }

  // ---------- capture ----------
  $('add').addEventListener('click', ()=>{ add($('cap').value); $('cap').value=''; $('cap').focus(); });
  $('cap').addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); add(e.target.value); e.target.value=''; }
  });

  const root = document.querySelector('.lg');

  // ---------- clicks ----------
  root.addEventListener('click', e=>{
    const btn = e.target.closest('button'); if(!btn) return;

    // category management
    if(btn.id === 'editAccts'){ editing = !editing; renderLedger(); return; }
    if(btn.id === 'doneAccts'){ editing = false; renderLedger(); return; }
    if(btn.id === 'addAcct'){
      const id = 'a'+Date.now().toString(36);
      state.accts.push({id, label:'New category', color:PALETTE[state.accts.length % PALETTE.length]});
      tab = id; save(); renderLedger(); renderJournal();
      const inp = root.querySelector('[data-rename="'+id+'"]');
      if(inp){ inp.focus(); inp.select(); }
      return;
    }
    if(btn.dataset.cycle){
      const a = acct(btn.dataset.cycle);
      a.color = PALETTE[(PALETTE.indexOf(a.color)+1) % PALETTE.length];
      save(); renderLedger(); renderJournal(); return;
    }
    if(btn.dataset.delacct){
      const id = btn.dataset.delacct;
      if(!btn.classList.contains('confirm')){
        root.querySelectorAll('.ed-del.confirm').forEach(b=>{ b.classList.remove('confirm'); b.textContent='Delete'; });
        btn.classList.add('confirm'); btn.textContent='Confirm';
        setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove('confirm'); btn.textContent='Delete'; } }, 4000);
        return;
      }
      state.items.forEach(i=>{ if(i.acct===id){ i.acct=null; i.done=false; } });
      state.accts = state.accts.filter(a=>a.id!==id);
      if(tab===id) tab = state.accts[0].id;
      save(); render(); return;
    }

    if(btn.dataset.tab){ tab = btn.dataset.tab; renderLedger(); return; }

    // item actions
    const row = e.target.closest('.row'); if(!row) return;
    const item = find(row.dataset.id); if(!item) return;
    if(btn.dataset.post){
      item.acct = btn.dataset.post; tab = item.acct;
      const sib = state.items.filter(i=>i.acct===item.acct && i.id!==item.id).map(ordOf);
      item.ord = sib.length ? Math.min(...sib) - 1 : 0;
    }
    else if(btn.hasAttribute('data-unpost')){ item.acct = null; item.done = false; }
    else if(btn.hasAttribute('data-check')){ item.done = !item.done; }
    else if(btn.hasAttribute('data-del')){ state.items = state.items.filter(i=>i.id!==item.id); }
    else return;
    save(); render();
  });

  // ---------- inline edits ----------
  root.addEventListener('focusout', e=>{
    const el = e.target;
    if(!el.hasAttribute) return;

    if(el.hasAttribute('data-rename')){
      const a = acct(el.getAttribute('data-rename')); if(!a) return;
      const v = el.value.trim();
      if(!v){ el.value = a.label; return; }
      if(v !== a.label){ a.label = v; save(); renderJournal(); renderTabs(state.items.filter(i=>i.acct!==null)); }
      return;
    }
    if(el.hasAttribute('data-edit')){
      const item = find(el.closest('.row').dataset.id); if(!item) return;
      const v = el.textContent.trim();
      if(!v){ el.textContent = item.text; return; }
      if(v !== item.text){ item.text = v; save(); }
    }
  });

  root.addEventListener('keydown', e=>{
    if(e.key !== 'Enter' || e.isComposing) return;
    if(e.target.hasAttribute && (e.target.hasAttribute('data-edit') || e.target.hasAttribute('data-rename'))){
      e.preventDefault(); e.target.blur();
    }
  });

  // ---------- footer ----------
  $('toggleDone').addEventListener('click', e=>{
    showDone = !showDone;
    e.target.textContent = showDone ? 'Hide done' : 'Show done';
    render();
  });

  $('copy').addEventListener('click', async e=>{
    const lines = [];
    const inbox = state.items.filter(i=>i.acct===null);
    if(inbox.length){
      lines.push('[Unsorted]');
      inbox.forEach(i=>lines.push(`${i.done?'[x]':'[ ]'} ${pad(i.n)}  ${i.text}`));
      lines.push('');
    }
    state.accts.forEach(a=>{
      const l = state.items.filter(i=>i.acct===a.id);
      if(!l.length) return;
      lines.push(`【${a.label}】`);
      l.forEach(i=>lines.push(`${i.done?'[x]':'[ ]'} ${pad(i.n)}  ${i.text}`));
      lines.push('');
    });
    const text = lines.join('\n').trim() || '(empty)';
    try{ await navigator.clipboard.writeText(text); e.target.textContent='Copied'; }
    catch(err){ e.target.textContent='Copy failed'; }
    setTimeout(()=>{ e.target.textContent='Copy all'; }, 1600);
  });

  // ---------- drag to reorder (mouse + touch) ----------
  let drag = null;

  root.addEventListener('pointerdown', e=>{
    const handle = e.target.closest('[data-handle]');
    if(!handle) return;
    const row = handle.closest('.row');
    const list = row && row.parentElement;
    if(!row || !list || list.id !== 'llist') return;
    e.preventDefault();
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    drag = {row, list, id:e.pointerId};
    row.classList.add('dragging');
    list.classList.add('dragging-on');
  });

  root.addEventListener('pointermove', e=>{
    if(!drag || e.pointerId !== drag.id) return;
    e.preventDefault();
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const over = el && el.closest && el.closest('.row');
    if(!over || over === drag.row || over.parentElement !== drag.list) return;
    const r = over.getBoundingClientRect();
    const after = e.clientY > r.top + r.height / 2;
    drag.list.insertBefore(drag.row, after ? over.nextSibling : over);
  });

  function endDrag(){
    if(!drag) return;
    const rows = [...drag.list.querySelectorAll('.row')];
    rows.forEach((el, idx)=>{
      const it = find(el.dataset.id);
      if(it) it.ord = idx;
    });
    drag.row.classList.remove('dragging');
    drag.list.classList.remove('dragging-on');
    drag = null;
    save(); render();
  }
  root.addEventListener('pointerup', endDrag);
  root.addEventListener('pointercancel', endDrag);

  // ---------- backup ----------
  $('exportBtn').addEventListener('click', e=>{
    try{
      const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date();
      const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
      a.href = url; a.download = 'thought-ledger-' + stamp + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      e.target.textContent='Exported';
    }catch(err){ e.target.textContent='Export failed'; }
    setTimeout(()=>{ e.target.textContent='Export'; }, 1600);
  });

  $('importBtn').addEventListener('click', ()=> $('importFile').click());
  $('importFile').addEventListener('change', e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const inc = JSON.parse(r.result);
        if(!inc || !Array.isArray(inc.items)) throw 0;
        const haveA = new Set(state.accts.map(a=>a.id));
        (inc.accts||[]).forEach(a=>{ if(!haveA.has(a.id)){ state.accts.push(a); haveA.add(a.id); } });
        const haveI = new Set(state.items.map(i=>i.id));
        let added = 0;
        inc.items.forEach(i=>{
          if(haveI.has(i.id)) return;
          if(i.acct && !haveA.has(i.acct)) i.acct = null;
          state.items.push(i); added++;
        });
        state.seq = Math.max(state.seq||0, inc.seq||0);
        state.items.sort((a,b)=>b.ts-a.ts);
        save(); render();
        setStatus(added ? ('Merged ' + added) : 'Nothing new');
      }catch(err){ setStatus("Couldn't read file"); }
      e.target.value = '';
    };
    r.readAsText(f);
  });

  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onMode = ()=>render();
    if(mq.addEventListener) mq.addEventListener('change', onMode);
    else if(mq.addListener) mq.addListener(onMode);
  }

  load();
  $('cap').focus();
})();
</script>
